name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Publish Windows Standalone Executable
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./win_dist
          Copy-Item 'Start.bat', 'README.md', 'LICENSE' './win_dist/'
          Remove-Item './win_dist/*.pdb' -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path './win_dist/*' -DestinationPath 'AppleMusicDiscordRPC-Windows-x64.zip' -CompressionLevel Optimal

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: AppleMusicDiscordRPC-Windows-x64.zip

  build-macos:
    name: Build macOS Release
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build macOS App Bundle
        run: |
          cd macos
          chmod +x build.sh
          ./build.sh
          mv AppleMusicDiscordRPC-macOS.zip ../

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: AppleMusicDiscordRPC-macOS.zip

  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Release
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Download macOS Release
        uses: actions/download-artifact@v4
        with:
          name: macos-release

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Apple Music Discord RPC ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: |
            AppleMusicDiscordRPC-Windows-x64.zip
            AppleMusicDiscordRPC-macOS.zip
          generate_release_notes: true
